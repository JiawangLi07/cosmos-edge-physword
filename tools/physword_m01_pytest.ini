[pytest]
# Isolated M0/M1 profile: avoid the application's serving/training fixture imports.
addopts = --noconftest
python_files = *_test.py
cache_dir = /tmp/physword-pytest-cache
markers =
    level(n): repository test level
    gpus(n): native CUDA attention test
    L0: upstream CPU unit test
    CPU: upstream CPU unit test
